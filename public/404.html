<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var path = window.location.pathname;
    if (path.startsWith('/mr-crabs/admin/') || path === '/mr-crabs/admin') {
      window.location.replace('/mr-crabs/admin/index.html' + window.location.search + window.location.hash);
    } else {
      window.location.replace('/mr-crabs/index.html' + window.location.pathname.replace('/mr-crabs', '') + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
