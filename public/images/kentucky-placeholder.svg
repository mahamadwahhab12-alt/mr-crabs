<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006D77"/>
      <stop offset="100%" stop-color="#008C95"/>
    </linearGradient>
  </defs>
  <g transform="translate(200, 150)">
    <!-- Chicken drumstick 1 -->
    <g transform="translate(-50, 10)">
      <path d="M0 -30 Q-15 -10 0 10 Q15 -10 0 -30" fill="url(#chickenGradient)"/>
      <defs>
        <linearGradient id="chickenGradient" x1="-15" y1="-30" x2="15" y2="10" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFD700"/>
          <stop offset="50%" stop-color="#F6D365"/>
          <stop offset="100%" stop-color="#F4B942"/>
        </linearGradient>
      </defs>
      <!-- Bone -->
      <ellipse cx="-2" cy="5" rx="4" ry="8" fill="#FFF4D6"/>
      <ellipse cx="2" cy="5" rx="4" ry="8" fill="#FFF4D6"/>
      <!-- Crispy texture -->
      <g stroke="#D4A525" stroke-width="1" opacity="0.6">
        <line x1="-12" y1="-25" x2="-8" y2="-20"/>
        <line x1="-5" y1="-25" x2="0" y2="-20"/>
        <line x1="5" y1="-25" x2="10" y2="-20"/>
        <line x1="-12" y1="-10" x2="-8" y2="-5"/>
        <line x1="-5" y1="-10" x2="0" y2="-5"/>
        <line x1="5" y1="-10" x2="10" y2="-5"/>
        <line x1="-12" y1="5" x2="-8" y2="10"/>
      </g>
    </g>

    <!-- Chicken drumstick 2 -->
    <g transform="translate(50, 10) scale(-1, 1)">
      <path d="M0 -30 Q-15 -10 0 10 Q15 -10 0 -30" fill="url(#chickenGradient)"/>
      <ellipse cx="-2" cy="5" rx="4" ry="8" fill="#FFF4D6"/>
      <ellipse cx="2" cy="5" rx="4" ry="8" fill="#FFF4D6"/>
      <g stroke="#D4A525" stroke-width="1" opacity="0.6">
        <line x1="-12" y1="-25" x2="-8" y2="-20"/>
        <line x1="-5" y1="-25" x2="0" y2="-20"/>
        <line x1="5" y1="-25" x2="10" y2="-20"/>
        <line x1="-12" y1="-10" x2="-8" y2="-5"/>
        <line x1="-5" y1="-10" x2="0" y2="-5"/>
        <line x1="5" y1="-10" x2="10" y2="-5"/>
        <line x1="-12" y1="5" x2="-8" y2="10"/>
      </g>
    </g>

    <!-- Seasoning sprinkles -->
    <g fill="#E91E63" opacity="0.8">
      <circle cx="-60" cy="-40" r="2"/>
      <circle cx="-40" cy="-45" r="1.5"/>
      <circle cx="-30" cy="-35" r="2"/>
      <circle cx="30" cy="-40" r="2"/>
      <circle cx="50" cy="-35" r="1.5"/>
      <circle cx="60" cy="-45" r="2"/>
      <circle cx="-55" cy="20" r="1.5"/>
      <circle cx="55" cy="20" r="1.5"/>
    </g>
    <g fill="#FFD700" opacity="0.9">
      <circle cx="-50" cy="-38" r="1.5"/>
      <circle cx="40" cy="-38" r="1.5"/>
      <circle cx="50" cy="25" r="1"/>
    </g>
  </g>
  <text x="200" y="285" text-anchor="middle" fill="#FFD700" font-size="20" font-weight="bold" font-family="Fredoka, Arial">Kentucky Fried</text>
  <text x="200" y="305" text-anchor="middle" fill="#C8F7F2" font-size="14" font-family="Arial">Crispy & Golden</text>
</svg>