<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006D77"/>
      <stop offset="100%" stop-color="#008C95"/>
    </linearGradient>
  </defs>
  <g transform="translate(200, 150)">
    <!-- Bowl -->
    <path d="M-70 30 Q-70 -50 0 -70 Q70 -50 70 30 Q70 70 -70 70 Q-70 30 -70 30" fill="url(#bowlGradient)" stroke="#FFD700" stroke-width="3"/>
    <defs>
      <linearGradient id="bowlGradient" x1="-70" y1="-70" x2="70" y2="70" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFF4D6"/>
        <stop offset="50%" stop-color="#F6D365"/>
        <stop offset="100%" stop-color="#F4B942"/>
      </linearGradient>
    </defs>
    <!-- Rice -->
    <g fill="#FFF8E7">
      <ellipse cx="-40" cy="-20" rx="3" ry="2"/>
      <ellipse cx="-35" cy="-15" rx="2.5" ry="1.5"/>
      <ellipse cx="-30" cy="-22" rx="3" ry="2"/>
      <ellipse cx="-20" cy "-18" rx="2.5" ry="1.5"/>
      <ellipse cx="-15" cy="-25" rx="3" ry="2"/>
      <ellipse cx="0" cy="-20" rx="2.5" ry="1.5"/>
      <ellipse cx="15" cy="-18" rx="3" ry="2"/>
      <ellipse cx="25" cy="-22" rx="2.5" ry="1.5"/>
      <ellipse cx="35" cy="-18" rx="3" ry="2"/>
      <ellipse cx="45" cy="-25" rx="2.5" ry="1.5"/>
      <ellipse cx="-40" cy="0" rx="3" ry="2"/>
      <ellipse cx="-25" cy="5" rx="2.5" ry="1.5"/>
      <ellipse cx="0" cy="2" rx="3" ry="2"/>
      <ellipse cx="20" cy="5" rx="2.5" ry="1.5"/>
      <ellipse cx="40" cy="0" rx="3" ry="2"/>
      <ellipse cx="-30" cy="15" rx="2.5" ry="1.5"/>
      <ellipse cx="10" cy="18" rx="3" ry="2"/>
      <ellipse cx="30" cy="15" rx="2.5" ry="1.5"/>
    </g>
    <!-- Toppings - chicken pieces -->
    <g fill="#E91E63">
      <ellipse cx="-35" cy="-35" rx="12" ry="8"/>
      <ellipse cx="10" cy="-38" rx="10" ry="7"/>
      <ellipse cx="35" cy="-35" rx="11" ry="8"/>
    </g>
    <!-- Sauce drizzle -->
    <path d="M-45 -25 Q-30 -30 -20 -25" stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M0 -30 Q15 -35 25 -28" stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M35 -25 Q50 -30 55 -20" stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Garnish -->
    <g fill="#4CAF50">
      <path d="M-50 -55 Q-45 -60 -40 -55" stroke-width="3" fill="none" stroke="#4CAF50"/>
      <path d="M50 -55 Q55 -60 60 -55" stroke-width="3" fill="none" stroke="#4CAF50"/>
    </g>
  </g>
  <text x="200" y="285" text-anchor="middle" fill="#FFD700" font-size="20" font-weight="bold" font-family="Fredoka, Arial">Rizo Bowl</text>
  <text x="200" y="305" text-anchor="middle" fill="#C8F7F2" font-size="14" font-family="Arial">Mr. Crabs Style</text>
</svg>