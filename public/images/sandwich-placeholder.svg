<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006D77"/>
      <stop offset="100%" stop-color="#008C95"/>
    </linearGradient>
  </defs>
  <g transform="translate(200, 150)">
    <!-- Wrap/Sandwich -->
    <path d="M-70 -20 Q-70 -60 0 -70 Q70 -60 70 -20 Q70 50 -70 50 Q-70 -20 -70 -20" fill="url(#wrapGradient)"/>
    <defs>
      <linearGradient id="wrapGradient" x1="-70" y1="-70" x2="70" y2="50" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F6D365"/>
        <stop offset="50%" stop-color="#F4B942"/>
        <stop offset="100%" stop-color="#E91E63"/>
      </linearGradient>
    </defs>
    <!-- Filling visible at edges -->
    <g fill="#E91E63">
      <ellipse cx="-65" cy="-10" rx="5" ry="15"/>
      <ellipse cx="65" cy="-10" rx="5" ry="15"/>
      <ellipse cx="-65" cy="20" rx="5" ry="15"/>
      <ellipse cx="65" cy="20" rx="5" ry="15"/>
    </g>
    <!-- Lettuce sticking out -->
    <g fill="#4CAF50">
      <path d="M-68 -30 Q-75 -35 -68 -40"/>
      <path d="M68 -30 Q75 -35 68 -40"/>
      <path d="M-68 35 Q-75 40 -68 45"/>
      <path d="M68 35 Q75 40 68 45"/>
    </g>
    <!-- Sauce drizzle on top -->
    <path d="M-50 -65 Q-25 -75 0 -68 Q25 -75 50 -65" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Cut marks -->
    <g stroke="#FFF4D6" stroke-width="2" opacity="0.5">
      <line x1="-20" y1="-65" x2="-20" y2="45"/>
      <line x1="20" y1="-65" x2="20" y2="45"/>
    </g>
  </g>
  <text x="200" y="285" text-anchor="middle" fill="#FFD700" font-size="20" font-weight="bold" font-family="Fredoka, Arial">Sandwich</text>
  <text x="200" y="305" text-anchor="middle" fill="#C8F7F2" font-size="14" font-family="Arial">Fresh & Tasty</text>
</svg>