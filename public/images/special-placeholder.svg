<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#063B4C"/>
      <stop offset="50%" stop-color="#006D77"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
  </defs>
  <g transform="translate(200, 150)">
    <!-- Glowing background -->
    <ellipse cx="0" cy="0" rx="120" ry="90" fill="url(#glowGradient)" opacity="0.3"/>
    <defs>
      <radialGradient id="glowGradient" cx="0" cy="0" r="120" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFD700"/>
        <stop offset="50%" stop-color="#F6D365"/>
        <stop offset="100%" stop-color="#E91E63"/>
      </radialGradient>
    </defs>

    <!-- The Legendary Krabby Patty -->
    <!-- Top bun with glow -->
    <ellipse cx="0" cy="-50" rx="55" ry="18" fill="url(#bunGradient)" filter="url(#bunGlow)"/>
    <defs>
      <linearGradient id="bunGradient" x1="-55" y1="-68" x2="55" y2="-32" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFD700"/>
        <stop offset="50%" stop-color="#F6D365"/>
        <stop offset="100%" stop-color="#FFD700"/>
      </linearGradient>
      <filter id="bunGlow" x="-70" y="-90" width="140" height="80">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <!-- Sesame seeds -->
    <g fill="#E8A838">
      <ellipse cx="-30" cy="-55" rx="3" ry="1.5"/>
      <ellipse cx="10" cy="-58" rx="2.5" ry="1.2"/>
      <ellipse cx="35" cy="-53" rx="3" ry="1.5"/>
      <ellipse cx="-15" cy="-48" rx="2.5" ry="1.2"/>
      <ellipse cx="25" cy="-56" rx="2.5" ry="1.2"/>
      <ellipse cx="-40" cy="-52" rx="2.5" ry="1.2"/>
      <ellipse cx="40" cy="-50" rx="2.5" ry="1.2"/>
    </g>
    <!-- Secret sauce glow -->
    <ellipse cx="0" cy="-30" rx="40" ry="6" fill="url(#sauceGradient)" filter="url(#sauceGlow)"/>
    <defs>
      <linearGradient id="sauceGradient" x1="-40" y1="-36" x2="40" y2="-24" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FF6B6B"/>
        <stop offset="50%" stop-color="#FFD700"/>
        <stop offset="100%" stop-color="#FF6B6B"/>
      </linearGradient>
      <filter id="sauceGlow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <!-- Lettuce -->
    <path d="M-50 -35 Q-30 -45 0 -38 Q30 -45 50 -35 Q30 -25 0 -28 Q-30 -25 -50 -35" fill="#4CAF50" opacity="0.9"/>
    <!-- Tomato -->
    <ellipse cx="0" cy="-10" rx="45" ry="8" fill="#FF6B6B"/>
    <ellipse cx="0" cy="-10" rx="40" ry="6" fill="#E91E63"/>
    <!-- Cheese with holes -->
    <path d="M-45 5 L45 5 L35 18 L-35 18 Z" fill="url(#cheeseGradient)"/>
    <defs>
      <linearGradient id="cheeseGradient" x1="-45" y1="5" x2="45" y2="18" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFD700"/>
        <stop offset="50%" stop-color="#F6D365"/>
        <stop offset="100%" stop-color="#F4B942"/>
      </linearGradient>
    </defs>
    <g fill="#F4B942" opacity="0.8">
      <ellipse cx="-20" cy="12" rx="5" ry="3"/>
      <ellipse cx="10" cy="11" rx="4" ry="2.5"/>
      <ellipse cx="30" cy="12" rx="5" ry="3"/>
      <ellipse cx="-35" cy="10" rx="3" ry="2"/>
    </g>
    <!-- THE PATTY - legendary -->
    <ellipse cx="0" cy="30" rx="48" ry="15" fill="url(#pattyGradient)" filter="url(#pattyGlow)"/>
    <defs>
      <linearGradient id="pattyGradient" x1="-48" y1="15" x2="48" y2="45" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#8B4513"/>
        <stop offset="30%" stop-color="#5D4037"/>
        <stop offset="60%" stop-color="#3E2723"/>
        <stop offset="100%" stop-color("#1B5E20" /* dark green secret */) />
      </linearGradient>
      <filter id="pattyGlow">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <!-- Grill marks -->
    <g stroke="#2E1A10" stroke-width="2" opacity="0.7">
      <line x1="-35" y1="20" x2="-15" y2="20"/>
      <line x1="-10" y1="20" x2="10" y2="20"/>
      <line x1="15" y1="20" x2="35" y2="20"/>
      <line x1="-35" y1="35" x2="-15" y2="35"/>
      <line x1="-10" y1="35" x2="10" y2="35"/>
      <line x1="15" y1="35" x2="35" y2="35"/>
    </g>
    <!-- Bottom bun -->
    <ellipse cx="0" cy="58" rx="55" ry="15" fill="url(#bunGradient)"/>

    <!-- Magic sparkles -->
    <g fill="#FFD700" opacity="0.9">
      <polygon points="0,-85 2,-78 10,-78 4,-73 6,-65 0,-70 -6,-65 -4,-73 -10,-78 -2,-78" transform="rotate(-10)"/>
      <polygon points="0,-85 2,-78 10,-78 4,-73 6,-65 0,-70 -6,-65 -4,-73 -10,-78 -2,-78" transform="translate(80, -20) rotate(20) scale(0.7)"/>
      <polygon points="0,-85 2,-78 10,-78 4,-73 6,-65 0,-70 -6,-65 -4,-73 -10,-78 -2,-78" transform="translate(-80, -20) rotate(-20) scale(0.7)"/>
      <polygon points="0,-85 2,-78 10,-78 4,-73 6,-65 0,-70 -6,-65 -4,-73 -10,-78 -2,-78" transform="translate(60, 50) rotate(45) scale(0.5)"/>
      <polygon points="0,-85 2,-78 10,-78 4,-73 6,-65 0,-70 -6,-65 -4,-73 -10,-78 -2,-78" transform="translate(-60, 50) rotate(-45) scale(0.5)"/>
    </g>

    <!-- Mr. Krabs claw holding the patty -->
    <g transform="translate(-100, 40)">
      <path d="M0 0 Q-20 -10 -30 0 Q-25 15 -15 15 Q-10 10 0 0" fill="url(#crabGradient)"/>
      <defs>
        <linearGradient id="crabGradient" x1="-30" y1="0" x2="0" y2="15" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#E91E63"/>
          <stop offset="100%" stop-color="#FF6B6B"/>
        </linearGradient>
      </defs>
    </g>
    <g transform="translate(100, 40) scale(-1, 1)">
      <path d="M0 0 Q-20 -10 -30 0 Q-25 15 -15 15 Q-10 10 0 0" fill="url(#crabGradient)"/>
    </g>
  </g>
  <text x="200" y="285" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold" font-family="Fredoka, Arial" style="text-shadow: 0 0 20px #FFD700, 0 4px 8px rgba(0,0,0,0.5);">KRABBY PATTY SPECIAL</text>
  <text x="200" y="305" text-anchor="middle" fill="#C8F7F2" font-size="14" font-family="Arial">The Secret Formula - 15,000 IQD</text>
</svg>